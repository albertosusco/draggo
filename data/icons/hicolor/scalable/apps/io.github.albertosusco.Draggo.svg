<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="1" stop-color="#3584e4"/>
    </linearGradient>
    <linearGradient id="chin" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1a5fb4"/>
      <stop offset="0.5" stop-color="#1c71d8"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="inside" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3b7a"/>
      <stop offset="1" stop-color="#1a5fb4"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe6f"/>
      <stop offset="1" stop-color="#ff7800"/>
    </linearGradient>
    <linearGradient id="link" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c061cb"/>
      <stop offset="1" stop-color="#9141ac"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="64" cy="118" rx="52" ry="5" fill="#000" opacity="0.12"/>

  <!-- drawer opening -->
  <path d="M18 54 h92 a6 6 0 0 1 6 6 v10 H12 V60 a6 6 0 0 1 6 -6 z" fill="url(#inside)"/>

  <!-- photo -->
  <g transform="rotate(-14 38 50)">
    <rect x="18" y="26" width="40" height="48" rx="4" fill="#fff"/>
    <rect x="22" y="30" width="32" height="30" rx="2" fill="url(#sky)"/>
    <circle cx="45" cy="38" r="4.5" fill="#f6f5f4"/>
    <path d="M22 60 l10 -12 l8 8 l5 -5 l9 9 z" fill="#26a269"/>
  </g>

  <!-- document -->
  <g transform="rotate(4 66 40)">
    <path d="M48 12 h26 l12 12 v50 a4 4 0 0 1 -4 4 H48 a4 4 0 0 1 -4 -4 V16 a4 4 0 0 1 4 -4 z" fill="#fff"/>
    <path d="M74 12 v8 a4 4 0 0 0 4 4 h8 z" fill="#deddda"/>
    <rect x="52" y="32" width="26" height="4" rx="2" fill="#9a9996"/>
    <rect x="52" y="41" width="22" height="4" rx="2" fill="#9a9996"/>
    <rect x="52" y="50" width="26" height="4" rx="2" fill="#9a9996"/>
    <rect x="52" y="59" width="16" height="4" rx="2" fill="#9a9996"/>
  </g>

  <!-- link -->
  <g transform="rotate(16 94 50)">
    <rect x="76" y="30" width="36" height="40" rx="8" fill="url(#link)"/>
    <g fill="none" stroke="#fff" stroke-width="3.5" transform="rotate(-45 94 50)">
      <rect x="79" y="44.5" width="18" height="11" rx="5.5"/>
      <rect x="91" y="44.5" width="18" height="11" rx="5.5"/>
    </g>
  </g>

  <!-- drawer front -->
  <path d="M12 70 h104 v34 a10 10 0 0 1 -10 10 H22 a10 10 0 0 1 -10 -10 z" fill="url(#chin)"/>
  <path d="M12 66 h104 v32 a10 10 0 0 1 -10 10 H22 a10 10 0 0 1 -10 -10 z" fill="url(#front)"/>
  <path d="M12 66 h104 v2 H12 z" fill="#99c1f1"/>

  <!-- handle -->
  <rect x="46" y="80" width="36" height="10" rx="5" fill="#1a5fb4"/>
  <rect x="46" y="84" width="36" height="6" rx="3" fill="#0b3b7a" opacity="0.35"/>
</svg>
