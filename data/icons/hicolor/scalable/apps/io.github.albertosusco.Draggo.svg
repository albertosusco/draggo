  <path d="M8 90 h36 a6 6 0 0 1 6 6 a14 14 0 0 0 28 0 a6 6 0 0 1 6 -6 h36 v18 a10 10 0 0 1 -10 10 H18 a10 10 0 0 1 -10 -10 z"
